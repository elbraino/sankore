name: Validate data
# No path filters: the repo now holds both the data and the site that renders
# it, so a change to src/ can break the build just as a change to data/ can.
# Both jobs run on every push and PR.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py

  # CLAUDE.md: "Every build runs python scripts/validate.py first; broken data
  # fails the build." npm run build enforces that ordering.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
