name: Validate data
# No path filters: the repo now holds both the data and the site that renders
# it, so a change to src/ can break the build just as a change to data/ can.
# Both jobs run on every push and PR.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py

  # CLAUDE.md: "Every build runs python scripts/validate.py first; broken data
  # fails the build." npm run build enforces that ordering.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # `npm install`, not `npm ci`: sharp's optional `@img/sharp-wasm32` declares
      # `@emnapi/runtime`, which npm omits from a lockfile generated on macOS,
      # so `npm ci` fails on Linux runners with EUSAGE. The lockfile still pins
      # every version; install reconciles only the platform-specific optionals.
      - run: npm install --no-audit --no-fund
      - run: npm run build
