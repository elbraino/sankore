slug: mallet-intercepting-proxy-2018
title: "Mallet – an intercepting proxy for arbitrary protocols"
type: talk
year: 2018
authors: [rogan-dawes]
event: bsides-cape-town
language: en
abstract: >-
  In this talk, I will focus on a new open-source intercepting proxy named
  Mallet, based on the mature and high-performance Netty framework, that wraps
  it with a drag and drop graph-based graphical user interface and a
  datastore. In doing so, we gain access to an existing library of protocol
  implementations, including TLS (and SNI), various compression algorithms,
  HTTP, HTTP/2, MQTT, REDIS, and many others, and most important, an existing
  community of developers creating new protocol decoders and encoders, and the
  associated body of knowledge in this area.
