slug: attacking-pipelines-workflow-files-2024
title: "Attacking Pipelines: Large Scale Exploitation of Workflow Files"
type: talk
year: 2024
authors: [david-baker-effendi, rohan-dayaram]
event: bsides-cape-town
language: en
abstract: >-
  In this talk, we present a tool designed to perform large-scale scanning of
  GitHub repositories to identify potential expression injection
  vulnerabilities within their workflow files. Our system efficiently scrapes
  repositories, concurrently pulling and analysing workflow configurations for
  insecure patterns. Through this mining process, we have discovered that
  expression injection vulnerabilities are surprisingly prevalent, even among
  popular projects, and often go unnoticed. We have reached out to affected
  vendors for remediation and hypothesis this prevalence attributed to a lack
  of in detection mechanisms and key documentation on GitHub's end.
  Additionally, we found that even when vulnerabilities are patched, they can
  be easily reintroduced by interpolating sanitised values.
