slug: outsmarting-cyber-villains-2023
title: "Outsmarting cyber villains on a shoestring budget"
type: talk
year: 2023
authors: [roshan-harneker]
event: bsides-cape-town
language: en
abstract: >-
  This presentation covers the most common cyber threats affecting South
  Africa and how to combat them by building your own cyber threat intelligence
  platform on a budget. This presentation focuses on practical steps to help
  you get started with building your own cyber threat intel programme for your
  organisation - importantly - on a budget! The start of the presentation
  looks at the cybercrime crisis we face in SA and includes stats and info
  about the most prevalent threats noted and the "why" behind why these
  malicious acts are carried out. The next slides discuss strategies to combat
  the threats mentioned.
