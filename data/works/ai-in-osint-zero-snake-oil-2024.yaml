slug: ai-in-osint-zero-snake-oil-2024
title: "AI in OSINT – Zero snake oil"
type: talk
year: 2024
authors: [roelof-temmingh]
event: bsides-cape-town
language: en
abstract: >-
  In this blink-and-you'll-miss-it talk we cut all the introductions and
  waffle and, just like this abstract, get straight to the point :) Can we use
  AI in OSINT? Spoiler - yes and its pretty magical. We'll show, on screen,
  how AI helped solved real(ish) world cases. That's it. In the talk, I'll
  demo how we've build software that uses RAG AI to create an assistant that
  you can query about (deep, eg post authentication) web pages. I will show
  how the software works and then I will show results that were interesting.
  I'll end the talk with my predictions on how AI will impact OSINT in the
  near future.
