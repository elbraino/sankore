slug: hacking-satellites-with-sdr-2019
title: "Hacking satellites with Software Defined Radio (SDR)"
type: talk
year: 2019
authors: [gerard-de-jong]
event: bsides-cape-town
language: en
abstract: >-
  In this no holds barred down introduction to Software Defined Radio (SDR)
  you'll learn how you can write software to hack remote control security
  gates, track ships at sea, code your own aircraft radar, and ultimately how
  to download data directly from various satellites in low earth orbit with
  nothing more than a cheap USB dongle and a makeshift antenna.
