slug: put-words-in-my-mouth-2019
title: "Put Words In My Mouth"
type: talk
year: 2019
authors: [amy-mania]
event: bsides-cape-town
language: en
abstract: >-
  Money has been withdrawn from your account. You don't remember making, or
  authorising that transaction. When you follow up with the bank, they say you
  called earlier and requested the transfer - it was, after-all, you speaking
  - right? Unbeknownst to you, your voice was stolen, and so was your money.
  With the rise of voice authentication biometrics, so will the opportunities
  to spoof it. Text-to-Speech API's are constantly improving, with Google's
  technology now being indistinguishable from the real human speaker. Threat
  actors have access to a target's YouTube videos, social media posts.
