slug: authentication-is-broken-2019
title: "Authentication is Broken. Can We Try Fix It?"
type: talk
year: 2019
authors: [kgothatso-ngako]
event: bsides-cape-town
language: en
abstract: >-
  This talk seeks to demonstrate how the hardened derivation of hierarchically
  deterministic asymmetric keys can be used as an authentication mechanism
  that sites could use to replace the passwords. As anyone who frequents
  haveibeenpwned would know, password reuse is a major problem that is
  worsened by inevitable data leakages. Without the use of a password manager
  a person is prone to reuse a password at least once (or risk forgetting
  their password if they try to be clever by coming up with a new password for
  every site). In this proposed authentication mechanism sites would store
  xpubs instead of passwords. The xpubs would be used to derive public keys
  when authenticating users.
